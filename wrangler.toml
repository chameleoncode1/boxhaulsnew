# Cloudflare Pages project: static site (dist/) + Pages Functions (functions/) for booking.
# Secrets are never in this file. Set them with scripts/setup-secrets.sh (see deploy/cloudflare/README.md):
#   GOOGLE_MAPS_API_KEY   Places API (New) + Routes API, server-side only
#   QUOTE_SECRET          HMAC key that signs quotes (generated by the setup script)
#   TWILIO_ACCOUNT_SID    Twilio account SID (AC…)
#   TWILIO_AUTH_TOKEN     Twilio auth token
#   TWILIO_FROM           Twilio sending number (+1…) or Messaging Service SID (MG…)
#   CF_EMAIL_API_TOKEN    optional: Cloudflare API token with Email Sending permission
name = "boxhaulsnew"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[vars]
# Base URL for driver accept links in texts. Switch to https://boxhauls.com at cutover (docs/LAUNCH.md).
PUBLIC_SITE_URL = "https://boxhaulsnew.pages.dev"
# Booking alerts. Email sends only when CF_EMAIL_API_TOKEN is set and boxhauls.com is onboarded to Email Sending.
CF_ACCOUNT_ID = "1f24e7762766194f324ea652e0ed4e98"
BOOKING_ALERT_TO = "support@boxhauls.com"
BOOKING_EMAIL_FROM = "bookings@boxhauls.com"

[[d1_databases]]
binding = "DB"
database_name = "boxhauls-bookings"
database_id = "8de1b07a-000c-45c9-800b-0633c5520f6f"
migrations_dir = "migrations"
